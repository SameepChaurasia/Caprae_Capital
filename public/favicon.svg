<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="capraeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="32" height="32" rx="8" fill="#07090e"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="url(#capraeGrad)" stroke-width="1.2" opacity="0.6"/>

  <g transform="translate(4, 4) scale(0.75)" filter="url(#glow)">
    <polygon points="16 2 2 9 16 16 30 9 16 2" fill="url(#capraeGrad)" opacity="0.9"/>
    <polyline points="2 23 16 30 30 23" fill="none" stroke="url(#capraeGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="2 16 16 23 30 16" fill="none" stroke="url(#capraeGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
