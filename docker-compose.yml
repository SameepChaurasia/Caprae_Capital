version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caprae_leadgenius_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - caprae_network

networks:
  caprae_network:
    driver: bridge
